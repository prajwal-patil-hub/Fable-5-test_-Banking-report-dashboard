[project]
name = "sovereign-backend"
version = "0.1.0"
description = "Sovereign — Banking Annual Report Intelligence Platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
llm = [
    "anthropic>=0.40",
]
ocr = [
    "pytesseract>=0.3.10",
    "pypdfium2>=4.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
